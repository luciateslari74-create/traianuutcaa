<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шпоры Pro</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #ff3333;
            --text-main: #e0e0e0;
            --text-muted: #aaaaaa;
        }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding-bottom: 80px; 
        }
        
        /* Ссылка на VPN */
        .vpn-alert {
            background: linear-gradient(45deg, #8b0000, #ff3333);
            color: #fff;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            display: block;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(255, 0, 0, 0.3);
        }

        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 20px; 
            text-align: center; 
        }
        h1 { color: #fff; margin-top: 40px; }
        p { color: var(--text-muted); }

        /* Плавающая кнопка + */
        .fab { 
            position: fixed; 
            bottom: 20px; 
            left: 20px; 
            width: 60px; 
            height: 60px; 
            background-color: var(--accent); 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            color: #fff; 
            font-size: 36px; 
            cursor: pointer; 
            border: none; 
            z-index: 1000; 
            box-shadow: 0 4px 15px rgba(255, 51, 51, 0.5);
        }
        
        /* Модальное окно для добавления */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.8); 
            z-index: 2000; 
            justify-content: center; 
            align-items: center; 
        }
        .modal.active { display: flex; }
        .modal-content { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 12px; 
            width: 80%; 
            box-sizing: border-box;
        }
        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border-radius: 8px; 
            border: 1px solid #444; 
            background: #2a2a2a; 
            color: #fff; 
            box-sizing: border-box;
        }
        input[type="file"] {
            margin: 10px 0;
            color: var(--text-muted);
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button.action-btn { 
            flex: 1;
            padding: 12px; 
            background: var(--accent); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
        }
        button.cancel-btn {
            background: #444;
        }

        /* Карточки добавленных шпор */
        .shpora-card {
            background: var(--card-bg); 
            padding: 15px; 
            margin: 15px 0; 
            border-radius: 10px; 
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border-left: 4px solid var(--accent);
        }
        .shpora-card h3 {
            margin-top: 0;
            color: #fff;
        }
        .shpora-card img {
            width: 100%; 
            border-radius: 5px; 
            margin-top: 10px;
        }
    </style>
</head>
<body>

<!-- Ссылка на Proton VPN в Google Play -->
<a href="https://play.google.com/store/apps/details?id=ch.protonvpn.android" class="vpn-alert" target="_blank">
    С4АЧЯЙ БЛИН ВПН (PROTON VPN), ЧТОБЫ САЙТ НЕ ЗАБЛОКИРОВАЛИ!
</a>

<div class="container">
    <h1>Мои шпоры</h1>
    <p id="emptyText">Здесь пока пусто. Нажми +, чтобы добавить первую контрошу.</p>
    <div id="shporaList"></div>
</div>

<!-- Плавающая кнопка плюс -->
<button class="fab" onclick="document.getElementById('modal').classList.add('active')">+</button>

<!-- Окно добавления -->
<div class="modal" id="modal">
    <div class="modal-content">
        <h3>Добавить шпору</h3>
        <input type="text" id="themeInput" placeholder="Название темы (например: Алгебра вар. 1)">
        <input type="file" id="fileInput" accept="image/*" capture="environment">
        
        <div class="btn-group">
            <button class="action-btn cancel-btn" onclick="document.getElementById('modal').classList.remove('active')">Отмена</button>
            <button class="action-btn" onclick="addShpora()">Добавить</button>
        </div>
    </div>
</div>

<script>
    function addShpora() {
        const theme = document.getElementById('themeInput').value;
        const fileInput = document.getElementById('fileInput');
        
        if (theme && fileInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                // Скрываем текст "Здесь пока пусто"
                document.getElementById('emptyText').style.display = 'none';
                
                const list = document.getElementById('shporaList');
                list.innerHTML += `
                    <div class="shpora-card">
                        <h3>${theme}</h3>
                        <img src="${e.target.result}">
                    </div>
                `;
                
                // Очищаем поля и закрываем модалку
                document.getElementById('themeInput').value = '';
                fileInput.value = '';
                document.getElementById('modal').classList.remove('active');
            }
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            alert("Пожалуйста, введи название темы и выбери фотографию!");
        }
    }
</script>

</body>
  </html>
